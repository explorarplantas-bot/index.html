
<section id="explorar-identificador">
  <style>
    #explorar-identificador {
      max-width: 620px;
      margin: 24px auto;
      padding: 24px;
      border-radius: 24px;
      background: #f3ecd9;
      color: #145343;
      font-family: inherit;
    }

    #explorar-identificador h2 {
      margin-top: 0;
    }

    #explorar-identificador .area-foto {
      display: block;
      padding: 24px 16px;
      margin: 18px 0;
      border: 2px dashed #9bb8aa;
      border-radius: 18px;
      background: #fffdf8;
      text-align: center;
      cursor: pointer;
    }

    #explorar-identificador input {
      display: block;
      width: 100%;
      margin-top: 12px;
    }

    #explorar-identificador button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #075440;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    #explorar-identificador button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #explorar-identificador #ep-previa {
      display: block;
      max-width: 100%;
      max-height: 320px;
      margin: 16px auto;
      border-radius: 16px;
    }

    #explorar-identificador #ep-resultado {
      margin-top: 20px;
      padding: 18px;
      background: #fffdf8;
      border-radius: 18px;
      overflow-wrap: anywhere;
    }

    #explorar-identificador .ep-item {
      padding: 12px 0;
      border-bottom: 1px solid #e6e0d2;
    }

    #explorar-identificador .ep-item:last-child {
      border-bottom: 0;
    }

    #explorar-identificador .ep-item strong {
      display: block;
      margin-bottom: 5px;
    }

    #explorar-identificador [hidden] {
      display: none !important;
    }
  </style>

  <h2>Identifique sua planta 🌿</h2>
  <p>Envie uma foto e descubra o nome da planta e como cuidar dela.</p>

  <label class="area-foto" for="ep-foto">
    <strong>📷 Escolha uma foto ou tire uma foto</strong>
    <input
      id="ep-foto"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      capture="environment"
    />
  </label>

  <img id="ep-previa" alt="Prévia da planta" hidden />

  <button id="ep-botao" type="button">
    Identificar minha planta
  </button>

  <p id="ep-status" role="status" aria-live="polite"></p>
  <div id="ep-resultado" hidden></div>
</section>

<script>
(() => {
  const raiz = document.getElementById("explorar-identificador");
  if (!raiz || raiz.dataset.iniciado) return;
  raiz.dataset.iniciado = "sim";

  const entrada = raiz.querySelector("#ep-foto");
  const previa = raiz.querySelector("#ep-previa");
  const botao = raiz.querySelector("#ep-botao");
  const status = raiz.querySelector("#ep-status");
  const resultado = raiz.querySelector("#ep-resultado");

  let arquivo = null;

  entrada.addEventListener("change", () => {
    arquivo = entrada.files?.[0] || null;
    resultado.replaceChildren();
    resultado.hidden = true;
    previa.hidden = true;

    if (!arquivo) return;

    if (!["image/jpeg", "image/png", "image/webp"].includes(arquivo.type)) {
      status.textContent = "Escolha uma foto JPG, PNG ou WEBP.";
      arquivo = null;
      return;
    }

    previa.src = URL.createObjectURL(arquivo);
    previa.hidden = false;
    status.textContent = "Foto selecionada. Pronto para identificar.";
  });

  // Reduz fotos grandes antes do envio ao Cloudflare.
  async function prepararImagem(file) {
    const url = URL.createObjectURL(file);

    try {
      const img = new Image();
      img.src = url;
      await img.decode();

      const limite = 1400;
      const escala = Math.min(
        1,
        limite / Math.max(img.naturalWidth, img.naturalHeight)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * escala);
      canvas.height = Math.round(img.naturalHeight * escala);

      const contexto = canvas.getContext("2d");
      contexto.drawImage(img, 0, 0, canvas.width, canvas.height);

      return canvas.toDataURL("image/jpeg", 0.82);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function mostrarCampo(titulo, valor) {
    if (!valor || (Array.isArray(valor) && !valor.length)) return;

    const item = document.createElement("div");
    item.className = "ep-item";

    const nome = document.createElement("strong");
    nome.textContent = titulo;

    const texto = document.createElement("div");
    texto.textContent = Array.isArray(valor)
      ? valor.map(String).join(" • ")
      : String(valor);

    item.append(nome, texto);
    resultado.appendChild(item);
  }

  botao.addEventListener("click", async () => {
    if (!arquivo) {
      status.textContent = "Selecione uma foto da planta primeiro.";
      return;
    }

    botao.disabled = true;
    status.textContent = "Analisando a planta com o Gemini... 🌱";
    resultado.replaceChildren();
    resultado.hidden = true;

    try {
      const imagem = await prepararImagem(arquivo);

      const resposta = await fetch("/api/identificar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imagem })
      });

      const dados = await resposta.json();

      if (!resposta.ok || !dados.sucesso) {
        throw new Error(dados.erro || "Não foi possível identificar a planta.");
      }

      const p = dados.planta;

      const titulo = document.createElement("h3");
      titulo.textContent = p.identificacao || "Identificação provável";
      resultado.appendChild(titulo);

      mostrarCampo("🔬 Nome científico", p.nome_cientifico);
      mostrarCampo("🌿 Família botânica", p.familia);
      mostrarCampo("📊 Confiança da identificação", p.confianca);
      mostrarCampo("🔎 Características", p.caracteristicas);
      mostrarCampo("☀️ Iluminação", p.luz);
      mostrarCampo("💧 Rega", p.rega);
      mostrarCampo("🪴 Solo e drenagem", p.solo);
      mostrarCampo("🌱 Adubação", p.adubacao);
      mostrarCampo("🌾 Propagação", p.propagacao);
      mostrarCampo("⚠️ Toxicidade", p.toxicidade);
      mostrarCampo("✅ Cuidados básicos", p.cuidados);
      mostrarCampo("ℹ️ Observações", p.observacao);

      resultado.hidden = false;
      status.textContent = "Identificação concluída! Confira os cuidados.";

    } catch (erro) {
      status.textContent = erro.message ||
        "Falha na comunicação. Tente novamente.";
    } finally {
      botao.disabled = false;
    }
  });
})();
</script>
